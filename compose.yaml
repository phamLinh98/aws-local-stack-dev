services:
  console:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8001}:8001"
    environment:
      PORT: 8001
      HOST: 0.0.0.0
      LAB_CONTAINER: "1"
      DATA_DIR: /data
      LAB_INTERNAL_ENDPOINT: http://console:8001
      LAB_NETWORK: local-aws-lab
      REGISTRY_PORT: ${REGISTRY_PORT:-5001}
    volumes:
      - workspace:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lab
    mem_limit: 512m
    memswap_limit: 512m
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  workspace:
networks:
  lab:
    name: local-aws-lab
